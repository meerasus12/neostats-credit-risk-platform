version: "3.9"

services:

  credit-risk-platform:

    build: .

    container_name: credit-risk-platform

    ports:
      - "5000:5000"

    env_file:
      - .env

    volumes:
      - ./data:/app/data
      - ./documents:/app/documents
      - ./models:/app/models
      - ./credit_risk.db:/app/credit_risk.db

    restart: unless-stopped